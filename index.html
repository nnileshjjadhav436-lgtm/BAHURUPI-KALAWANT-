<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>बहुरुपी कलावंत | BAHURUPI KALAWANT</title>
    <!-- Google Fonts for Indian & Theater Royal Look -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <style>
        :root {
            --gold-gradient: linear-gradient(135deg, #ffd700 0%, #ffae19 50%, #d48806 100%);
            --red-velvet: #4a0404;
            --dark-stage: #090302;
            --card-bg: rgba(35, 10, 10, 0.85);
            --gold-border: #d4af37;
            --text-glow: 0 0 12px rgba(255, 215, 0, 0.5);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: var(--dark-stage);
            background-image: 
                radial-gradient(circle at 50% 10%, rgba(139, 0, 0, 0.45), transparent 70%),
                radial-gradient(circle at 50% 90%, rgba(212, 175, 55, 0.1), transparent 60%);
            color: #fff4e6;
            font-family: 'Tiro Devanagari Marathi', serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 24px 12px;
        }

        .main-stage {
            width: 100%;
            max-width: 820px;
            background: var(--card-bg);
            border: 2px solid var(--gold-border);
            border-radius: 20px;
            padding: 32px 24px;
            box-shadow: 0 0 35px rgba(212, 175, 55, 0.25), inset 0 0 20px rgba(0,0,0,0.8);
            position: relative;
        }

        /* Nataraja Header Section */
        .hero {
            text-align: center;
            border-bottom: 2px dashed rgba(212, 175, 55, 0.4);
            padding-bottom: 24px;
            margin-bottom: 28px;
        }

        .nataraj-container {
            width: 110px;
            height: 110px;
            margin: 0 auto 16px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(212, 175, 55, 0.2) 0%, transparent 70%);
            border: 2px solid var(--gold-border);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.4);
        }

        .nataraj-img {
            width: 85px;
            height: 85px;
            object-fit: contain;
            filter: drop-shadow(0 0 8px #ffd700);
        }

        .title-mr {
            font-family: 'Rozha One', serif;
            font-size: 2.8rem;
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: var(--text-glow);
            letter-spacing: 1px;
            line-height: 1.2;
            margin-bottom: 6px;
        }

        .title-en {
            font-family: 'Cinzel Decorative', cursive;
            font-size: 1.1rem;
            color: #f7d794;
            letter-spacing: 4px;
            font-weight: 700;
        }

        /* Founder Banner */
        .lineage-card {
            background: linear-gradient(90deg, rgba(80, 0, 0, 0.5), rgba(40, 0, 0, 0.8), rgba(80, 0, 0, 0.5));
            border-left: 4px solid #ffd700;
            border-right: 4px solid #ffd700;
            border-radius: 12px;
            padding: 16px 20px;
            margin-bottom: 30px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            font-size: 1.15rem;
        }

        .lineage-card span {
            color: #ffd700;
            font-family: 'Yatra One', cursive;
            font-size: 1.25rem;
        }

        /* Section Headings */
        .section-header {
            font-family: 'Yatra One', cursive;
            color: #ffeaa7;
            font-size: 1.55rem;
            margin: 28px 0 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            border-left: 5px solid #d4af37;
            padding-left: 10px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.6);
        }
